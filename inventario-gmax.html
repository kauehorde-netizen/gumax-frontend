<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventário GMAX — GMAX LEAGUE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0612; --bg-secondary: #110a1f; --bg-elevated: #1a0f2e;
  --primary: #8b5cf6; --primary-light: #a78bfa;
  --accent-cyan: #22d3ee; --accent-yellow: #facc15; --accent-orange: #f97316;
  --accent-red: #ef4444; --accent-green: #10b981;
  --text-primary: #e0e7ff; --text-secondary: #a5a3b8; --text-muted: #6b6885;
  --border: rgba(139,92,246,.15);
  /* Tier colors */
  --t-common:    #4b69ff;
  --t-rare:      #8847ff;
  --t-epic:      #d32ce6;
  --t-legendary: #eb4b4b;
  --t-mythical:  #facc15;
  --t-ancient:   #ff8800;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif; color: var(--text-primary); min-height: 100vh;
  background: radial-gradient(ellipse at top, rgba(139,92,246,.10), transparent 60%), var(--bg-primary);
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url('bg-gmax-league.png');
  background-size: cover; background-position: center; background-repeat: no-repeat;
  opacity: 0.5; z-index: -10; pointer-events: none;
}
header { background: rgba(8,6,14,0.55); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.header-content { max-width: 1300px; margin: 0 auto; padding: 14px 24px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
.brand { display: inline-flex; align-items: center; justify-self: center; }
.brand img { height: 32px; width: auto; opacity: .95; }
.nav-back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(139,92,246,.15); border: 1px solid rgba(139,92,246,.3); border-radius: 10px; color: var(--primary-light); text-decoration: none; font-size: 13px; font-weight: 600; }
.header-actions { justify-self: end; }

main { max-width: 1300px; margin: 0 auto; padding: 32px 20px 80px; position: relative; z-index: 1; }

.page-header { text-align: center; margin-bottom: 36px; }
.page-header h1 {
  font-size: 38px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px;
  background: linear-gradient(135deg, #facc15, #f97316);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.page-header .subtitle { font-size: 14px; color: var(--text-muted); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 28px; }
.tier-tab {
  padding: 8px 14px; cursor: pointer; user-select: none;
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
  border-radius: 10px; font-size: 12px; font-weight: 700;
  color: var(--text-secondary);
  transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
}
.tier-tab:hover { background: rgba(255,255,255,.08); }
.tier-tab.active { background: var(--tier-color, var(--primary))20; border-color: var(--tier-color, var(--primary)); color: #fff; }
.tier-tab .count { font-family: 'JetBrains Mono',monospace; opacity: 0.7; font-size: 11px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.skin-card {
  background: linear-gradient(180deg, rgba(20,16,40,.85), rgba(15,10,30,.92));
  border: 1px solid var(--border);
  border-radius: 14px; padding: 14px;
  position: relative; overflow: hidden;
  transition: transform .15s, border-color .2s, box-shadow .2s;
  cursor: pointer;
}
.skin-card:hover {
  transform: translateY(-3px);
  border-color: var(--tier-color, var(--primary));
  box-shadow: 0 8px 24px var(--tier-color, var(--primary))40;
}
.skin-card[data-tier="common"]    { --tier-color: var(--t-common); }
.skin-card[data-tier="rare"]      { --tier-color: var(--t-rare); }
.skin-card[data-tier="epic"]      { --tier-color: var(--t-epic); }
.skin-card[data-tier="legendary"] { --tier-color: var(--t-legendary); }
.skin-card[data-tier="mythical"]  { --tier-color: var(--t-mythical); }
.skin-card[data-tier="ancient"]   { --tier-color: var(--t-ancient); }

.skin-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--tier-color, var(--primary));
  box-shadow: 0 0 12px var(--tier-color, var(--primary));
}
.skin-card.equipped {
  border: 2px solid var(--accent-green);
  box-shadow: 0 0 20px rgba(16,185,129,.3);
}
.skin-card.equipped::after {
  content: '✓ EQUIPADA'; position: absolute; top: 8px; right: 8px;
  background: rgba(16,185,129,.85); color: #fff;
  padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; letter-spacing: 1px;
}

.skin-image {
  width: 100%; aspect-ratio: 16/9;
  background: radial-gradient(circle at center, var(--tier-color, transparent)20, transparent 70%);
  border-radius: 8px; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.skin-image img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }

.skin-name { font-size: 14px; font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
.skin-weapon { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.skin-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
.skin-tier-pill {
  padding: 3px 8px; border-radius: 6px;
  background: var(--tier-color, var(--primary))25;
  color: var(--tier-color, var(--primary));
  font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
  border: 1px solid var(--tier-color, var(--primary))50;
}
.skin-source { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono',monospace; }

.empty-state { padding: 80px 20px; text-align: center; color: var(--text-muted); grid-column: 1 / -1; }
.empty-state h2 { font-size: 22px; color: var(--text-secondary); margin-bottom: 12px; }
.empty-state p { font-size: 14px; max-width: 420px; margin: 0 auto; line-height: 1.5; }
.empty-state .cta { display: inline-block; margin-top: 18px; padding: 10px 22px; background: linear-gradient(135deg, var(--primary), var(--accent-cyan)); color: #fff; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 13px; }

.loading { padding: 60px; text-align: center; color: var(--text-muted); }

/* Modal de detalhes/equipar */
#skinModal {
  position: fixed; inset: 0; z-index: 9000;
  display: none; align-items: center; justify-content: center;
  padding: 20px; background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
}
#skinModal.open { display: flex; }
.modal-content {
  background: linear-gradient(135deg, rgba(20,16,40,.97), rgba(15,10,30,.99));
  border: 2px solid var(--tier-color, var(--primary));
  border-radius: 18px; padding: 28px;
  max-width: 480px; width: 100%;
  position: relative;
  box-shadow: 0 20px 60px var(--tier-color, var(--primary))60;
  animation: modalIn 0.25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
.modal-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.08); border: none; color: #fff; font-size: 18px; cursor: pointer; }
.modal-close:hover { background: rgba(239,68,68,.3); }
.modal-img { width: 100%; aspect-ratio: 16/9; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, var(--tier-color, transparent)30, transparent 70%); border-radius: 12px; }
.modal-img img { max-width: 80%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 8px 16px rgba(0,0,0,.5)); }
.modal-title { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
.modal-weapon { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
.modal-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.modal-info-cell { background: rgba(255,255,255,.03); padding: 10px 12px; border-radius: 8px; }
.modal-info-cell .lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.modal-info-cell .val { font-size: 14px; font-weight: 700; }
.btn-equip {
  width: 100%; padding: 14px; cursor: pointer;
  background: linear-gradient(135deg, var(--accent-green), #15803d);
  color: #fff; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
  transition: filter .15s, transform .12s;
}
.btn-equip:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-equip:disabled { opacity: 0.5; cursor: wait; }
.btn-equip.unequip { background: linear-gradient(135deg, #6b6885, #4b5263); }

.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 9500; padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 13px; animation: tIn 0.2s ease-out; }
.toast.success { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }
.toast.error { background: linear-gradient(135deg, #dc2626, #991b1b); color: #fff; }
@keyframes tIn { from { opacity:0; transform:translate(-50%,-10px); } to { opacity:1; transform:translate(-50%,0); } }

/* Banner soft de "preview mode" enquanto MySQL não está pronto */
.preview-banner {
  background: linear-gradient(135deg, rgba(250,204,21,.15), rgba(249,115,22,.10));
  border: 1px solid rgba(250,204,21,.4);
  border-radius: 12px; padding: 12px 18px;
  margin-bottom: 24px; text-align: center;
  font-size: 13px; color: #fde047;
}
.preview-banner strong { color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <a href="lobbies.html" class="nav-back">← Voltar</a>
    <a class="brand" href="lobbies.html"><img src="gmax-league-logo.png" alt="GMAX LEAGUE"></a>
    <div class="header-actions">
      <a href="leaderboard.html" class="nav-back" style="background: rgba(250,204,21,.15); border-color: rgba(250,204,21,.3); color: var(--accent-yellow);">🏆 Leaderboard</a>
    </div>
  </div>
</header>

<main>
  <div class="page-header">
    <h1>🎁 Inventário GMAX</h1>
    <p class="subtitle">Skins ganhas em partidas — só funcionam no servidor da GMAX LEAGUE</p>
  </div>

  <div id="previewBanner" class="preview-banner" style="display:none;">
    🔧 <strong>Modo preview</strong> — sistema de skins server-side ainda em setup. Skins exibidas aqui são placeholder.
  </div>

  <div class="filters" id="filters"></div>

  <div id="grid" class="grid"></div>
</main>

<div id="skinModal" onclick="if(event.target.id==='skinModal')closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
const API_BASE = 'https://gumax-backend-production.up.railway.app';
const TIER_LABELS = {
  common:    { label: 'Comum',     emoji: '🟦' },
  rare:      { label: 'Raro',      emoji: '🟪' },
  epic:      { label: 'Épico',     emoji: '🟣' },
  legendary: { label: 'Lendário',  emoji: '🔴' },
  mythical:  { label: 'Mítico',    emoji: '🟡' },
  ancient:   { label: 'Ancestral', emoji: '🟠' },
};
const TIER_ORDER = ['ancient','mythical','legendary','epic','rare','common'];

let _catalog = null;          // skins-catalog.json
let _inventory = [];          // user's owned items
let _activeFilter = 'all';
let _steamId = null;          // do url ?id= ou do user logado

function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function fmtTime(ms) { if (!ms) return '—'; const d = new Date(ms); return d.toLocaleDateString('pt-BR', { day:'2-digit',month:'2-digit',year:'2-digit' }); }
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

async function loadCatalog() {
  try {
    const r = await fetch('skins-catalog.json');
    _catalog = await r.json();
    return _catalog;
  } catch (e) {
    console.error('Catalog load failed:', e);
    return [];
  }
}

async function loadInventory(steamId) {
  try {
    const r = await fetch(`${API_BASE}/api/inventory/${encodeURIComponent(steamId)}`);
    if (!r.ok) {
      if (r.status === 404) return { items: [], source: '404' };
      return { items: [], source: 'error' };
    }
    const data = await r.json();
    return data;
  } catch (e) {
    console.error('Inventory load failed:', e);
    return { items: [], source: 'error' };
  }
}

function findSkinInCatalog(paintKit, weapon) {
  return (_catalog || []).find(s => s.paintKit === paintKit && s.weapon === weapon)
      || (_catalog || []).find(s => s.paintKit === paintKit);
}

function renderFilters() {
  const counts = { all: _inventory.length };
  for (const t of TIER_ORDER) counts[t] = 0;
  for (const it of _inventory) counts[it.tier] = (counts[it.tier] || 0) + 1;

  const filtersEl = document.getElementById('filters');
  const tabs = [
    { key: 'all', label: 'Todos', emoji: '✨' },
    ...TIER_ORDER.map(t => ({ key: t, label: TIER_LABELS[t]?.label, emoji: TIER_LABELS[t]?.emoji })),
  ];
  filtersEl.innerHTML = tabs.map(t => `
    <div class="tier-tab ${t.key === _activeFilter ? 'active' : ''}"
         data-key="${t.key}" data-tier="${t.key}"
         onclick="setFilter('${t.key}')"
         style="${t.key !== 'all' ? `--tier-color: var(--t-${t.key});` : ''}">
      ${t.emoji} ${t.label} <span class="count">${counts[t.key]||0}</span>
    </div>
  `).join('');
}

function setFilter(k) {
  _activeFilter = k;
  renderFilters();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  let filtered = _inventory;
  if (_activeFilter !== 'all') filtered = filtered.filter(it => it.tier === _activeFilter);

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <h2>${_inventory.length === 0 ? '🎁 Nenhuma skin ainda' : 'Nenhuma skin nesse tier'}</h2>
        <p>${_inventory.length === 0
            ? 'Vença partidas, seja MVP ou ganhe títulos pra começar a colecionar. Skins ganhas aparecem aqui e podem ser equipadas no servidor da liga.'
            : 'Tenta outro filtro ou ganha mais partidas pra colecionar mais.'}</p>
        ${_inventory.length === 0 ? '<a class="cta" href="lobbies.html">Ir pra Lobbies →</a>' : ''}
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map(it => {
    const cat = findSkinInCatalog(it.paintKit || it.paint_kit, it.weapon);
    const name = cat?.name || `${it.weapon} ${it.paintKit||it.paint_kit}`;
    const weaponName = cat?.weaponDisplayName || it.weapon;
    const img = cat?.image || '';
    const equipped = !!(it.equipped);
    return `
      <div class="skin-card ${equipped ? 'equipped' : ''}" data-tier="${it.tier}" data-id="${it.id}" onclick="openSkinModal('${it.id}')">
        <div class="skin-image">${img ? `<img src="${esc(img)}" alt="${esc(name)}" onerror="this.style.display='none'">` : ''}</div>
        <div class="skin-name">${esc(name)}</div>
        <div class="skin-weapon">${esc(weaponName)}</div>
        <div class="skin-meta">
          <span class="skin-tier-pill">${TIER_LABELS[it.tier]?.label || it.tier}</span>
          <span class="skin-source">${esc(it.source||'').replace(/_/g,' ')}</span>
        </div>
      </div>
    `;
  }).join('');
}

function openSkinModal(itemId) {
  const it = _inventory.find(x => String(x.id) === String(itemId));
  if (!it) return;
  const cat = findSkinInCatalog(it.paintKit || it.paint_kit, it.weapon);
  const name = cat?.name || `${it.weapon}`;
  const weaponName = cat?.weaponDisplayName || it.weapon;
  const img = cat?.image || '';

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-img">${img ? `<img src="${esc(img)}" alt="${esc(name)}">` : ''}</div>
    <div class="modal-title" style="color:var(--t-${it.tier});">${esc(name)}</div>
    <div class="modal-weapon">${esc(weaponName)}</div>
    <div class="modal-info">
      <div class="modal-info-cell"><div class="lbl">Tier</div><div class="val" style="color:var(--t-${it.tier})">${TIER_LABELS[it.tier]?.emoji||''} ${TIER_LABELS[it.tier]?.label||it.tier}</div></div>
      <div class="modal-info-cell"><div class="lbl">Origem</div><div class="val">${esc(it.source||'').replace(/_/g,' ')}</div></div>
      <div class="modal-info-cell"><div class="lbl">Ganho em</div><div class="val">${fmtTime(it.awardedAt || it.awarded_at)}</div></div>
      <div class="modal-info-cell"><div class="lbl">Paint kit</div><div class="val" style="font-family:'JetBrains Mono',monospace;">${it.paintKit || it.paint_kit}</div></div>
    </div>
    <button class="btn-equip ${it.equipped ? 'unequip' : ''}" onclick="doEquip('${it.id}', ${!it.equipped})">
      ${it.equipped ? '✓ Equipada — clique pra desequipar' : '⚙️ Equipar no servidor'}
    </button>
  `;
  // Aplica cor do tier no border do modal
  document.getElementById('modalContent').style.setProperty('--tier-color', `var(--t-${it.tier})`);
  document.getElementById('skinModal').classList.add('open');
}

function closeModal() {
  document.getElementById('skinModal').classList.remove('open');
}

async function doEquip(itemId, equip) {
  const it = _inventory.find(x => String(x.id) === String(itemId));
  if (!it) return;
  // TODO: passar idToken pra autenticar; aqui ainda sem auth no UI standalone
  toast(equip ? '🔧 Equipando...' : 'Removendo equip...');
  try {
    const r = await fetch(`${API_BASE}/api/inventory/equip`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ itemId, paintKit: it.paintKit || it.paint_kit, weapon: it.weapon, action: equip ? 'equip' : 'unequip' }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      toast(d.error || 'Erro ao equipar', 'error');
      return;
    }
    toast(equip ? '✓ Skin equipada!' : '✓ Removida');
    closeModal();
    init(); // reload inventory
  } catch (e) {
    toast('Erro de rede', 'error');
  }
}

async function init() {
  const params = new URLSearchParams(location.search);
  _steamId = params.get('id');
  if (!_steamId) {
    document.getElementById('grid').innerHTML = `
      <div class="empty-state">
        <h2>Sem SteamID</h2>
        <p>Use ?id=<seu_steamid> ou logue na lobby pra ver teu inventário.</p>
      </div>`;
    return;
  }
  document.getElementById('grid').innerHTML = '<div class="loading">Carregando inventário…</div>';
  await loadCatalog();
  const inv = await loadInventory(_steamId);
  _inventory = inv.items || [];
  // Banner aviso quando ainda em stub mode (Firestore)
  if (inv.source === 'firestore-stub' || inv.source === '404' || inv.source === 'error') {
    document.getElementById('previewBanner').style.display = '';
  }
  renderFilters();
  renderGrid();
}

init();
</script>
</body>
</html>
