<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard — GMAX LEAGUE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0612; --bg-secondary: #110a1f; --bg-elevated: #1a0f2e;
  --primary: #8b5cf6; --primary-light: #a78bfa;
  --accent-cyan: #22d3ee; --accent-yellow: #facc15; --accent-orange: #f97316;
  --accent-red: #ef4444; --accent-green: #10b981;
  --text-primary: #e0e7ff; --text-secondary: #a5a3b8; --text-muted: #6b6885;
  --border: rgba(139,92,246,.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif; color: var(--text-primary); min-height: 100vh;
  background: radial-gradient(ellipse at top, rgba(139,92,246,.10), transparent 60%), var(--bg-primary);
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url('bg-gmax-league.png');
  background-size: cover; background-position: center; background-repeat: no-repeat;
  opacity: 0.5; z-index: -10; pointer-events: none;
}
header { background: rgba(8,6,14,0.55); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.header-content { max-width: 1300px; margin: 0 auto; padding: 14px 24px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
.brand { display: inline-flex; align-items: center; justify-self: center; }
.brand img { height: 32px; width: auto; opacity: .95; }
.nav-back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(139,92,246,.15); border: 1px solid rgba(139,92,246,.3); border-radius: 10px; color: var(--primary-light); text-decoration: none; font-size: 13px; font-weight: 600; }
.nav-back:hover { background: rgba(139,92,246,.25); }
.header-actions { justify-self: end; display: flex; gap: 8px; }

main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; position: relative; z-index: 1; }

.match-hero {
  background: linear-gradient(135deg, rgba(20,16,40,.85), rgba(15,10,30,.92));
  border: 1px solid var(--border); border-radius: 18px; padding: 24px;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center;
  margin-bottom: 24px;
}
.team-block { text-align: center; }
.team-block.winner .team-name { color: var(--accent-green); }
.team-block.loser .team-name { color: var(--text-muted); }
.team-name { font-size: 18px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
.team-tag { font-size: 11px; color: var(--text-muted); }

.score-block {
  display: flex; align-items: center; gap: 14px; padding: 0 24px;
  font-family: 'JetBrains Mono', monospace; font-weight: 900;
}
.score-num { font-size: 56px; }
.score-num.winner { color: var(--accent-green); text-shadow: 0 0 20px rgba(16,185,129,.4); }
.score-num.loser { color: var(--text-muted); }
.score-x { font-size: 28px; color: var(--text-muted); }

.match-meta {
  display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
  margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.04);
}
.meta-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.meta-item strong { color: var(--text-secondary); font-weight: 700; }

.scoreboard {
  background: linear-gradient(135deg, rgba(20,16,40,.85), rgba(15,10,30,.92));
  border: 1px solid var(--border); border-radius: 16px; padding: 14px;
  margin-bottom: 16px;
}
.team-title {
  font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 6px 12px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.team-title.team-a { color: var(--accent-cyan); }
.team-title.team-b { color: var(--accent-orange); }

.player-row {
  display: grid;
  grid-template-columns: 32px 1fr 50px 50px 50px 60px 50px 50px;
  gap: 8px; align-items: center;
  padding: 10px 12px; border-radius: 8px; margin-bottom: 4px;
  background: rgba(255,255,255,.02); border: 1px solid transparent;
  transition: background .15s;
  font-size: 13px;
}
.player-row:hover { background: rgba(255,255,255,.06); border-color: var(--primary)40; }
.player-row .avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: rgba(139,92,246,.2); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.player-row .avatar img { width: 100%; height: 100%; object-fit: cover; }
.player-row .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-row .name a { color: inherit; text-decoration: none; }
.player-row .name a:hover { color: var(--primary-light); }
.player-row .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; text-align: right; }
.player-row .kdr.high { color: var(--accent-green); }
.player-row .kdr.low { color: var(--accent-red); }
.player-row .mvp { color: var(--accent-yellow); text-align: center; }

.col-headers {
  display: grid; grid-template-columns: 32px 1fr 50px 50px 50px 60px 50px 50px;
  gap: 8px; padding: 6px 12px; font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
}
.col-headers .col-num { text-align: right; }
.col-headers .col-mvp { text-align: center; }

.empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
.empty-state h2 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }

.loading { text-align: center; padding: 60px 20px; color: var(--text-muted); }

@media (max-width: 720px) {
  .match-hero { grid-template-columns: 1fr; gap: 14px; padding: 18px; }
  .score-block { padding: 0; justify-content: center; }
  .score-num { font-size: 42px; }
  .player-row, .col-headers { grid-template-columns: 28px 1fr 44px 44px 50px 40px; gap: 6px; padding: 8px; font-size: 12px; }
  .player-row .col-adr, .player-row .col-hs, .col-headers .col-adr, .col-headers .col-hs { display: none; }
}

.demo-cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 22px; margin: 18px auto 0;
  background: linear-gradient(135deg, rgba(34,211,238,.15), rgba(139,92,246,.15));
  border: 1px solid rgba(34,211,238,.4); border-radius: 10px;
  color: var(--accent-cyan); font-size: 13px; font-weight: 700; text-decoration: none;
  letter-spacing: .3px; transition: transform .15s, background .15s;
}
.demo-cta:hover { transform: translateY(-1px); background: linear-gradient(135deg, rgba(34,211,238,.25), rgba(139,92,246,.25)); }

.tag-result {
  display: inline-block; padding: 3px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 800; letter-spacing: 1px;
}
.tag-result.win  { background: rgba(16,185,129,.18); color: var(--accent-green); border: 1px solid rgba(16,185,129,.4); }
.tag-result.loss { background: rgba(239,68,68,.18); color: var(--accent-red); border: 1px solid rgba(239,68,68,.4); }
.tag-result.tie  { background: rgba(250,204,21,.18); color: var(--accent-yellow); border: 1px solid rgba(250,204,21,.4); }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <a href="lobbies.html" class="nav-back">← Voltar</a>
    <a class="brand" href="lobbies.html"><img src="gmax-league-logo.png" alt="GMAX LEAGUE"></a>
    <div class="header-actions">
      <a href="leaderboard.html" class="nav-back" style="background: rgba(250,204,21,.15); border-color: rgba(250,204,21,.3); color: var(--accent-yellow);">🏆 Leaderboard</a>
    </div>
  </div>
</header>

<main>
  <div id="content" class="loading">Carregando partida…</div>
</main>

<script>
const API_BASE = 'https://gumax-backend-production.up.railway.app';
const MAP_LABELS = {
  de_mirage: 'Mirage', de_inferno: 'Inferno', de_dust2: 'Dust 2',
  de_nuke: 'Nuke', de_anubis: 'Anubis', de_ancient: 'Ancient',
  de_cache: 'Cache', de_train: 'Train', de_overpass: 'Overpass',
  de_vertigo: 'Vertigo',
};

function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function fmtDate(ms) {
  if (!ms) return '—';
  const d = new Date(ms);
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

async function loadMatch() {
  const params = new URLSearchParams(location.search);
  const matchId = params.get('id');
  if (!matchId) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><h2>ID da partida não fornecido</h2><p>Use ?id=...</p></div>';
    return;
  }
  try {
    const r = await fetch(`${API_BASE}/api/match/${encodeURIComponent(matchId)}/scoreboard`);
    if (!r.ok) {
      if (r.status === 404) {
        document.getElementById('content').innerHTML = '<div class="empty-state"><h2>Partida não encontrada</h2><p>O ID pode estar errado ou foi deletado.</p></div>';
      } else {
        document.getElementById('content').innerHTML = `<div class="empty-state"><h2>Erro ${r.status}</h2></div>`;
      }
      return;
    }
    const m = await r.json();
    render(m);
  } catch (e) {
    console.error(e);
    document.getElementById('content').innerHTML = `<div class="empty-state"><h2>Erro de rede</h2><p>${esc(e.message)}</p></div>`;
  }
}

function render(m) {
  const winner = m.winner;
  const aWin = winner === 'A';
  const bWin = winner === 'B';
  const tied = winner === 'tie';

  const heroHtml = `
    <div class="match-hero">
      <div class="team-block ${aWin ? 'winner' : (bWin ? 'loser' : '')}">
        <div class="team-name">Time A</div>
        <div class="team-tag">${(m.teamA||[]).length} jogadores</div>
      </div>
      <div class="score-block">
        <span class="score-num ${aWin ? 'winner' : (bWin ? 'loser' : '')}">${m.scoreA||0}</span>
        <span class="score-x">×</span>
        <span class="score-num ${bWin ? 'winner' : (aWin ? 'loser' : '')}">${m.scoreB||0}</span>
      </div>
      <div class="team-block ${bWin ? 'winner' : (aWin ? 'loser' : '')}">
        <div class="team-name">Time B</div>
        <div class="team-tag">${(m.teamB||[]).length} jogadores</div>
      </div>
    </div>
    <div class="match-hero" style="grid-template-columns: 1fr; padding: 14px 24px; gap:0;">
      <div class="match-meta">
        <span class="meta-item"><strong>Mapa:</strong> ${esc(MAP_LABELS[m.map] || m.map || '—')}</span>
        <span class="meta-item"><strong>Data:</strong> ${esc(fmtDate(m.finishedAt || m.createdAt))}</span>
        <span class="meta-item"><strong>Status:</strong> ${esc(m.status || '—')}</span>
        ${tied ? '<span class="meta-item tag-result tie">EMPATE</span>' : ''}
      </div>
      ${m.demoUrl ? `
        <a href="${esc(m.demoUrl)}" target="_blank" rel="noopener" download class="demo-cta">
          🎬 Baixar Demo (.dem)
        </a>
      ` : ''}
    </div>
  `;

  const stats = m.stats || {};
  const renderTeam = (team, label, cls) => {
    if (!team || !team.length) return '';
    const rows = team.map(p => {
      const s = stats[p.steamId] || {};
      const k = s.kills || 0, d = s.deaths || 0, a = s.assists || 0;
      const adr = Math.round(s.adr || 0);
      const hs = s.hsRate || 0;
      const mvps = s.mvps || 0;
      const kdr = d > 0 ? (k / d).toFixed(2) : k.toFixed(2);
      const kdrCls = (k/d) >= 1.5 ? 'high' : (k/d) >= 1 ? '' : 'low';
      const profileLink = p.steamId ? `jogador.html?id=${encodeURIComponent(p.steamId)}` : '#';
      const avatarInner = p.avatar
        ? `<img src="${esc(p.avatar)}" onerror="this.style.display='none'">`
        : esc((p.name||'?').charAt(0).toUpperCase());
      return `
        <div class="player-row">
          <div class="avatar">${avatarInner}</div>
          <div class="name"><a href="${profileLink}">${esc(p.name||'—')}</a></div>
          <div class="num">${k}</div>
          <div class="num">${d}</div>
          <div class="num">${a}</div>
          <div class="num kdr ${kdrCls}">${kdr}</div>
          <div class="num col-adr">${adr}</div>
          <div class="num col-hs">${hs}%</div>
          <div class="num mvp">${mvps>0 ? '⭐'.repeat(Math.min(mvps,3)) : '—'}</div>
        </div>
      `;
    }).join('');
    return `
      <section class="scoreboard">
        <div class="team-title ${cls}">${label}</div>
        <div class="col-headers">
          <span></span><span>Jogador</span>
          <span class="col-num">K</span><span class="col-num">D</span><span class="col-num">A</span>
          <span class="col-num">KDR</span>
          <span class="col-num col-adr">ADR</span><span class="col-num col-hs">HS%</span>
          <span class="col-mvp">MVP</span>
        </div>
        ${rows}
      </section>
    `;
  };

  const teamsHtml = renderTeam(m.teamA || [], `🟦 Time A ${aWin ? '— VENCEDOR' : ''}`, 'team-a')
                  + renderTeam(m.teamB || [], `🟥 Time B ${bWin ? '— VENCEDOR' : ''}`, 'team-b');

  const noStatsBanner = (!m.stats || !Object.keys(m.stats).length)
    ? `<div class="empty-state" style="background:linear-gradient(135deg, rgba(20,16,40,.85), rgba(15,10,30,.92));border:1px solid var(--border);border-radius:14px;margin-bottom:16px;">
         <h2>Stats não disponíveis</h2>
         <p>Esta partida não registrou estatísticas (talvez foi cancelada ou jogada antes do tracking).</p>
       </div>`
    : '';

  document.getElementById('content').innerHTML = heroHtml + noStatsBanner + teamsHtml;
}

loadMatch();
</script>
</body>
</html>
